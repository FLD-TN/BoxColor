# BoxColor - các màu có sẵn trong shop. Thứ tự trong file = thứ tự trong GUI
# Rank nào được màu nào: xem tiers.yml
#
# Mỗi màu:
#   display:  tên hiện trong GUI (tự tô bằng chính màu đó, không cần mã màu)
#   type:     solid (màu đơn) | gradient (chuyển màu, cần 2 mã trở lên) | rainbow (cầu vồng)
#   colors:   các mã hex (rainbow không cần)
#   animated: true = màu chạy liên tục (chỉ chạy ở TAB, nametag và GUI; trong chat hiện đứng yên)
#   speed:    thời gian chạy hết một vòng màu, tính bằng mili giây (mặc định 3000)
#   saturation, brightness: độ đậm và độ sáng của cầu vồng, từ 0 đến 1 (mặc định 0.6 và 1)
#   icon:     item trong GUI (không bắt buộc, mặc định gui.default-color-icon trong config.yml)
#
# Đổi mã (tên khoá như hong_pastel) của màu đang có người dùng thì họ sẽ mất màu đó
# Màu chat để sáng, dễ đọc trên nền chat tối. Màu chuyển động chỉ dùng cho tên

