# BoxColor - cấu hình chung
# Màu có sẵn nằm trong colors.yml, rank nào được màu nào nằm trong tiers.yml

# Cách viết mã màu trong placeholder %boxcolor_name%, %boxcolor_chat%...
#   ampersand   = &#RRGGBB        (TAB, UnlimitedNameTags, EzChat)
#   section     = §x§R§R§G§G§B§B   (plugin không tự đổi mã '&')
#   minimessage = <#RRGGBB>
# Thêm đuôi _mm vào placeholder để lấy MiniMessage bất kể dòng này
placeholder-format: ampersand

# Màu tên theo rank, dùng khi người chơi chưa chọn màu tên nào (chọn màu trong GUI sẽ đè lên)
# Khoá là tên group LuckPerms (kiểm tra bằng permission group.<tên>). Xét từ trên xuống, gặp group đầu tiên
# người chơi có thì dùng, nên xếp rank cao lên trước. 1 mã = màu đơn, nhiều mã = chuyển màu
# Không muốn dùng: rank-name-colors: {}
rank-name-colors:
  admin: ['#FD4747', '#F36767']
  moderator: ['#3399FF']
  helper: ['#FF99FF']
  youtube: ['#FF5555']
  overlord: ['#CD6BC6']
  ultimate: ['#FD84B5']
  zeus: ['#86B851']
  champion: ['#D3F66E']
  legend: ['#FF7C12', '#F3C890']
  master: ['#4956FF', '#A5ABFF']
  hero: ['#55C1FD']
  titan: ['#FA340C']
  elite: ['#82F1D9']
  default: ['#AAAAAA']

# Màu tên khi không có màu nào ở trên
default-name-color: '#FFFFFF'

# Đặt display name của người chơi theo nick + màu tên (tin nhắn chết, vào/thoát server...)
# Nếu dùng EssentialsX: đặt change-displayname: false trong config của Essentials để hai plugin không ghi đè nhau
set-display-name: true

# Bao lâu kiểm tra lại quyền một lần (giây). Mất rank thì màu/nick tạm ẩn, lên lại rank là hiện lại
access-check-seconds: 30

# Màu tên chuyển động ở TAB và nametag
animation:
  # false = mọi màu chuyển động đứng yên (vẫn giữ màu), dùng khi server nặng. Đổi xong /boxcolor reload
  enabled: true
  # Một khung hình dài bao nhiêu mili giây. Nên bằng số làm mới của '%boxcolor_name%' trong TAB
  # (placeholder-refresh-intervals) và UNT (placeholderUpdateRates, tính bằng tick: 2 tick = 100ms)
  # Tăng lên 200 hoặc 250 để giảm một nửa số gói tin, màu chạy giật hơn một chút
  frame-ms: 100

chat:
  # Tô màu nội dung chat theo màu chat đã chọn
  enabled: true
  # Người chơi tự gõ mã màu thì giữ màu của họ, không tô màu chat
  keep-typed-colors: true
  # Tin nhắn có một trong các mẫu này được coi là tự gõ màu (dòng 'regex:' là biểu thức chính quy)
  # Gồm mã '&', hex, và tag [color=...] [font=...] của InteractiveChat
  typed-color-patterns:
    - 'regex:&[0-9a-fk-orA-FK-OR]'
    - 'regex:&?#[0-9a-fA-F]{6}'
    - 'regex:<#[0-9a-fA-F]{6}>'
    - 'regex:(?i)\[color='
    - 'regex:(?i)\[font='
  # Giữ nguyên không tô màu để InteractiveChat vẫn nhận ra (dòng 'regex:' là biểu thức chính quy)
  # Mặc định: mọi từ khoá dạng [chữ] ([item], [inv], [e], [money], [ah], [pos]...) và tag @tên
  keep-plain:
    - 'regex:\[[^\[\]\s]{1,24}\]'
    - 'regex:@\S+'
  # Giữ nguyên tên thật và nick của người đang online trong tin nhắn, để InteractiveChat gắn hover/click
  keep-player-names: true
  # Câu mẫu xem trước màu chat trong GUI
  preview-text: 'Xin chào mọi người'

nick:
  min-length: 3
  max-length: 16
  allow-spaces: true
  allow-vietnamese: true
  # Thời gian chờ giữa hai lần đổi nick (giây), 0 = không chờ. Bỏ qua bằng boxcolor.nick.bypass-cooldown
  cooldown-seconds: 3600
  # Chặn nick trùng hoặc gần giống tên thật của người chơi khác (kể cả offline), chống giả mạo
  # So sánh bỏ dấu, không phân biệt hoa thường, coi 0=o, 1=i=l, 3=e, 4=a, 5=s, 7=t, bỏ dấu cách và _
  check-real-names: true
  # Nick chứa các từ này (so như trên) sẽ bị chặn
  blocked-words:
    - admin
    - owner
    - staff
    - moderator
    - helper
    - console

custom:
  # Số mã màu tối đa khi tự chỉnh (1 mã = màu đơn, từ 2 mã = chuyển màu)
  max-colors: 5
  # Thời gian chờ người chơi nhập mã màu/nick vào chat sau khi bấm trong GUI (giây)
  input-timeout-seconds: 45

gui:
  border: GRAY_STAINED_GLASS_PANE
  filler: BLACK_STAINED_GLASS_PANE
  # Icon mặc định của mỗi màu (giáp da sẽ được nhuộm theo màu). Đổi riêng từng màu bằng 'icon' trong colors.yml
  default-color-icon: LEATHER_CHESTPLATE
