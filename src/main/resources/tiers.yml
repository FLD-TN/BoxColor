# BoxColor - rank nào được màu nào
#
# Mỗi rank chỉ cần MỘT permission trong LuckPerms: boxcolor.tier.<số>
#   ví dụ: /lp group elite permission set boxcolor.tier.1 true
# Tier cao tự có hết màu và tính năng của các tier thấp hơn, không cần cho kế thừa trong LuckPerms
# (menu /rank gỡ rank cũ khi mua rank mới cũng không sao)
# Mỗi tier chỉ ghi những gì nó MỞ THÊM
#
#   name:        tên hiện trong GUI ở dòng "Mở khóa: ...", có mã màu '&'
#   chat-colors: mã màu trong colors.yml (mục chat)
#   name-colors: mã màu trong colors.yml (mục name)
#   features:    custom-chat (tự chỉnh mã màu chat), nick (Màu tùy chỉnh: tự đặt tên, tô màu từng chữ, /nick),
#                animated-name (vào trang Màu tên động), animated-chat (vào trang Màu chat động)
#
# Màu không nằm trong tier nào: chỉ mở bằng permission lẻ boxcolor.color.<chat|name>.<mã>, ví dụ quà sự kiện
# Tính năng lẻ: boxcolor.feature.<custom-chat|nick|animated-name|animated-chat>
# boxcolor.admin: mở mọi thứ
# Sửa xong chạy /boxcolor reload

tiers:
  1:
    name: '&#5FE2C5Elite'
    chat-colors: [bac_ha, hong_pastel, vang_kem]
    name-colors: [ngoc_lam, hong_dao, vang_nang]
    # Màu tùy chỉnh: tự đặt tên, tô màu từng chữ (/nick)
    features: [nick]
  2:
    name: '&#CF2121Titan'
    chat-colors: [oai_huong, cam_dao, xanh_troi]
    name-colors: [do_ruby, tim_mong, xanh_duong]
  3:
    name: '&#6FB0E3Hero'
    chat-colors: [la_non, hong_phan, bang_tuyet]
    name-colors: [bien_xanh, keo_bong, chanh_bac_ha]
  4:
    name: '&#41ABFFMaster'
    chat-colors: [dao_hong, bien_lang, nang_som]
    name-colors: [lua_chay, bang_gia, rung_thong]
  5:
    name: '&#FDA94BLegend'
    chat-colors: [hoang_hon, mat_ong, hoa_anh_dao]
    name-colors: [hoang_kim, hoa_sen, ho_phach]
  6:
